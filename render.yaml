# Hours Back CRM — the web app stays on Render's free tier (it naps when idle
# and wakes in about a minute). The weekday email job has Render's $1 monthly
# minimum and remains inactive until Russ approves deployment.
services:
  - type: web
    name: hoursback-crm
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npx prisma generate
    # THE APP DOES NOT RESHAPE THE DATABASE. It used to run `prisma db push`
    # here on every restart, which means the live site rebuilds the data's
    # shape from whatever code happens to be deployed. On 2026-09-01 that
    # took the CRM down for twenty-five minutes and tried to DELETE three
    # new tables — only the fact that they already held rows stopped it.
    # Shape changes are applied deliberately, by hand, after the code that
    # understands them is live. Never by a restart.
    startCommand: node scripts/hoursback/crm-app.js
    envVars:
      - key: DATABASE_URL
        sync: false   # the Supabase connection address - pasted in the dashboard
      - key: DIRECT_URL
        sync: false
      - key: CRM_PASSWORD
        sync: false   # the CRM's front-door password - typed in the dashboard
      - key: RESEND_API_KEY
        sync: false   # the sending key - pasted in the dashboard, never in Git
      - key: HOURSBACK_EMAIL_FROM
        sync: false   # who the mail comes from, e.g. Russ Wright <russ@visionairy.biz>
      # The Google Places key is deliberately NOT deployed - standing order
      # 2026-08-25: no Places requests until Russ lifts it in writing.
  - type: cron
    name: hoursback-email-sender
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --production=false && npx prisma generate
    startCommand: node scripts/hoursback/send-due-emails.js
    schedule: "0 17 * * MON-FRI"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: HOURSBACK_EMAIL_FROM
        sync: false
      - key: HOURSBACK_REPORT_TO
        sync: false   # where the morning send summary goes
      - key: HOURSBACK_EMAIL_REPLY_TO
        sync: false   # replies@visionairy.biz after that address is ready
      - key: INBOX_USER
        sync: false   # dedicated Gmail address that receives a copy of replies
      - key: INBOX_APP_PASSWORD
        sync: false   # Gmail app password; keep only in Render
      - key: HOURSBACK_SEND_LIMIT
        value: "5"    # first live batch approved by Russ on 2026-09-09
      # Customer outreach remains off after deployment. Only after Russ gives
      # separate approval, add HOURSBACK_CUSTOMER_EMAIL_ENABLED=true in Render.
