# Hours Back CRM — free everywhere: the app on Render's free tier (naps when
# idle, wakes in ~1 min), the data permanent in Russ's Supabase "VisionAIry
# CRM" project. Nothing here costs money.
services:
  - type: web
    name: hoursback-crm
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npx prisma generate
    # THE APP DOES NOT RESHAPE THE DATABASE. It used to run `prisma db push`
    # here on every restart, which means the live site rebuilds the data's
    # shape from whatever code happens to be deployed. On 2026-09-01 that
    # took the CRM down for twenty-five minutes and tried to DELETE three
    # new tables — only the fact that they already held rows stopped it.
    # Shape changes are applied deliberately, by hand, after the code that
    # understands them is live. Never by a restart.
    startCommand: node scripts/hoursback/crm-app.js
    envVars:
      - key: DATABASE_URL
        sync: false   # the Supabase connection address - pasted in the dashboard
      - key: DIRECT_URL
        sync: false
      - key: CRM_PASSWORD
        sync: false   # the CRM's front-door password - typed in the dashboard
      - key: RESEND_API_KEY
        sync: false   # the sending key - pasted in the dashboard, never in Git
      - key: HOURSBACK_EMAIL_FROM
        sync: false   # who the mail comes from, e.g. Russ Wright <russ@visionairy.biz>
      # The Google Places key is deliberately NOT deployed - standing order
      # 2026-08-25: no Places requests until Russ lifts it in writing.
